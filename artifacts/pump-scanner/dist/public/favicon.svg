<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <radialGradient id="sweepGrad" cx="256" cy="256" r="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blip1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sweepGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="188"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer ring border -->
  <circle cx="256" cy="256" r="190" stroke="#1e293b" stroke-width="1.5" fill="none"/>

  <!-- Radar sweep sector clipped to circle -->
  <g clip-path="url(#circleClip)">
    <!-- Sweep fill: from center pointing to upper-right (315°), trailing 100° -->
    <!-- 315° = upper right: x=256+188*cos(315°)=256+133=389, y=256+188*sin(315°)=256-133=123 -->
    <!-- 215° trailing edge: x=256+188*cos(215°)=256-154=102, y=256+188*sin(215°)=256+108=364 -->
    <path d="M256,256 L389,123 A188,188,0,0,0,102,364 Z" fill="url(#sweepGrad)"/>
  </g>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="155" stroke="#1e3a2a" stroke-width="1" fill="none" opacity="0.9"/>
  <circle cx="256" cy="256" r="115" stroke="#1e3a2a" stroke-width="1" fill="none" opacity="0.9"/>
  <circle cx="256" cy="256" r="75"  stroke="#1e3a2a" stroke-width="1" fill="none" opacity="0.9"/>
  <circle cx="256" cy="256" r="38"  stroke="#1e3a2a" stroke-width="1" fill="none" opacity="0.9"/>

  <!-- Crosshair lines -->
  <line x1="68" y1="256" x2="444" y2="256" stroke="#1e293b" stroke-width="1" opacity="0.7"/>
  <line x1="256" y1="68" x2="256" y2="444" stroke="#1e293b" stroke-width="1" opacity="0.7"/>

  <!-- Sweep arm (bright gold line at 315°) -->
  <line x1="256" y1="256" x2="389" y2="123" stroke="#f59e0b" stroke-width="2.5" opacity="0.95" filter="url(#sweepGlow)"/>

  <!-- Signal blip 1 — strong green hit at ~330° ring 2 -->
  <circle cx="358" cy="149" r="6" fill="#22c55e" filter="url(#blip1)"/>
  <circle cx="358" cy="149" r="14" fill="#22c55e" opacity="0.12"/>

  <!-- Signal blip 2 — amber blip at ~310° ring 3 -->
  <circle cx="315" cy="177" r="4.5" fill="#f59e0b" filter="url(#blip1)"/>
  <circle cx="315" cy="177" r="11" fill="#f59e0b" opacity="0.12"/>

  <!-- Signal blip 3 — smaller green trailing blip -->
  <circle cx="385" cy="198" r="3.5" fill="#22c55e" opacity="0.7"/>
  <circle cx="385" cy="198" r="9" fill="#22c55e" opacity="0.08"/>

  <!-- Signal blip 4 — fading trail -->
  <circle cx="336" cy="128" r="2.5" fill="#22c55e" opacity="0.45"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="32" fill="url(#glowCenter)"/>
  <circle cx="256" cy="256" r="6" fill="#f59e0b"/>
  <circle cx="256" cy="256" r="3" fill="#fff5"/>

  <!-- Outer ring border highlight -->
  <circle cx="256" cy="256" r="190" stroke="#f59e0b" stroke-width="0.75" fill="none" opacity="0.18"/>
</svg>
